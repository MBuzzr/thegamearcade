<style>
:root {
  --bg:#06020f;
  --panel:rgba(19,17,38,0.86);
  --panel-2:rgba(26,22,58,0.9);
  --line:rgba(255,255,255,0.08);
  --line-strong:rgba(255,255,255,0.14);
  --cyan:#00E5FF;
  --pink:#FF2A8A;
  --yellow:#FFEB3B;
  --lime:#B6FF3B;
  --purple:#A78BFA;
  --text:#F3F2FF;
  --muted:#9AA0C3;
  --radius:18px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  background: radial-gradient(1200px 600px at 15% -10%, rgba(255,42,138,0.22), transparent 60%),
            radial-gradient(900px 500px at 85% 0%, rgba(0,229,255,0.18), transparent 60%),
            radial-gradient(800px 400px at 50% 120%, rgba(182,255,59,0.12), transparent),
            var(--bg);
  color:var(--text);
  font-family:'Space Grotesk', system-ui, sans-serif;
  overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.mono{font-family:'VT323', monospace; letter-spacing:0.5px}
a{color:inherit}
.wrap{max-width:1160px;margin:0 auto;padding:0 24px}
/* HEADER */
header{
  position:sticky;top:0;z-index:100;
  backdrop-filter:blur(18px) saturate(1.3);
  background:rgba(6,2,15,0.78);
  border-bottom:1px solid var(--line);
}
.bar{display:flex;justify-content:space-between;align-items:center;height:68px}
.brand{display:flex;align-items:center;gap:12px;font-size:28px;color:#fff;text-decoration:none}
.brand img{width:44px;height:44px;border-radius:50%;box-shadow:0 0 18px rgba(255,42,138,0.5), 0 0 0 1px rgba(255,255,255,0.12);}
.brand b{font-weight:400}
.desk{display:flex;gap:22px;align-items:center}
.desk a{font-size:22px;color:var(--muted);text-decoration:none;transition:color .2s}
.desk a:hover{color:#fff}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--pink);color:#fff;border:1px solid var(--pink);
  padding:12px 22px;border-radius:999px;font-family:'VT323';font-size:22px;
  text-decoration:none;box-shadow:0 0 20px rgba(255,42,138,0.35);
  transition:transform .18s, box-shadow .18s, background .18s;
}
.btn:hover{transform:translateY(-2px);box-shadow:0 0 30px rgba(255,42,138,0.55);background:#ff3f95}
.btn-discord{
  background:#5865F2;border-color:#5865F2;
  box-shadow:0 0 20px rgba(88,101,242,0.35);
}
.btn-discord:hover{background:#4752c4;box-shadow:0 0 30px rgba(88,101,242,0.55)}
.btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(255,255,255,0.18);color:#fff;
  padding:12px 22px;border-radius:999px;font-family:'VT323';font-size:22px;
  text-decoration:none;backdrop-filter:blur(6px);
  transition:border-color .18s, transform .18s;
}
.btn-ghost:hover{border-color:var(--cyan);transform:translateY(-2px)}
.menu{display:none;position:relative}
.menu summary{list-style:none;cursor:pointer;font-size:28px;color:#fff}
.menu[open] .drop{display:flex}
.drop{
  display:none;position:absolute;right:0;top:52px;
  background:rgba(12,10,28,0.96);border:1px solid var(--line);border-radius:14px;
  padding:12px;flex-direction:column;gap:4px;min-width:200px;
  box-shadow:0 20px 60px rgba(0,0,0,0.6);
}
.drop a{font-size:22px;color:var(--muted);text-decoration:none;padding:8px 12px;border-radius:8px}
.drop a:hover{background:rgba(255,255,255,0.06);color:#fff}
@media(max-width:820px){.desk{display:none}.menu{display:block}}
/* TICKER */
.ticker{overflow:hidden;background:#0A0614;border-bottom:1px solid var(--line);height:38px;display:flex;align-items:center}
.ticker-track{display:flex;animation:ticker 35s linear infinite;white-space:nowrap}
.ticker span{font-family:'VT323';font-size:20px;color:var(--cyan);padding:0 18px;letter-spacing:1px}
.ticker .sep{color:var(--pink)}
@keyframes ticker{from{transform:translateX(0)}to{transform:translateX(-50%)}}
/* HERO */
.hero{padding:72px 0 40px;position:relative}
.hero-grid{display:grid;grid-template-columns:1.15fr .85fr;gap:36px;align-items:center}
@media(max-width:900px){.hero-grid{grid-template-columns:1fr}}
.kicker{
  display:inline-flex;align-items:center;gap:8px;
  border:1px solid rgba(0,229,255,0.25);background:rgba(0,229,255,0.08);
  color:var(--cyan);font-family:'VT323';font-size:18px;padding:6px 14px;border-radius:999px;
  margin-bottom:18px;
}
.kicker i{width:8px;height:8px;background:var(--cyan);border-radius:50%;display:inline-block;box-shadow:0 0 8px var(--cyan);animation:pulse 1.6s infinite}
@keyframes pulse{0%{opacity:1}50%{opacity:.4}100%{opacity:1}}
.hero h1{
  font-size:clamp(44px,7vw,84px);line-height:0.92;font-weight:400;
  text-shadow:0 0 30px rgba(255,42,138,0.25);
}
.hero h1 .line1{color:#fff;display:block}
.hero h1 .line2{color:transparent;-webkit-text-stroke:1.2px rgba(255,255,255,0.9);display:block}
.hero h1 .line3{background:linear-gradient(90deg,var(--pink),var(--cyan));-webkit-background-clip:text;-webkit-text-fill-color:transparent;display:block}
.lead{margin-top:18px;color:var(--muted);font-size:20px;line-height:1.6;max-width:560px}
.lead b{color:#fff;font-weight:600}
.hl-p{color:var(--pink)}.hl-c{color:var(--cyan)}.hl-y{color:var(--yellow)}
.cta{margin-top:28px;display:flex;flex-wrap:wrap;gap:14px}
.trust{margin-top:22px;display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--muted);font-size:14px}
.trust span::before{content:"✓ ";color:var(--lime)}
.hero-card{
  position:relative;background:linear-gradient(180deg, rgba(255,255,255,0.06), rgba(255,255,255,0.02));
  border:1px solid var(--line-strong);border-radius:24px;padding:18px;
  box-shadow:0 30px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.06);
  overflow:hidden;
}
.hero-card::before{
  content:"";position:absolute;inset:-1px;border-radius:24px;
  background:linear-gradient(120deg, rgba(255,42,138,0.5), rgba(0,229,255,0.5), transparent);
  z-index:-1;filter:blur(0px);opacity:.7;
}
.hero-visual{
  aspect-ratio:4/3;background:radial-gradient(400px 300px at 50% 30%, rgba(255,42,138,0.25), transparent),
                         radial-gradient(300px 200px at 80% 80%, rgba(0,229,255,0.2), transparent),
                         #0D0B1F;
  border-radius:16px;display:grid;place-items:center;position:relative;overflow:hidden;
  border:1px solid rgba(255,255,255,0.08);
}
.hero-visual img{width:58%;max-width:280px;border-radius:50%;box-shadow:0 0 60px rgba(255,42,138,0.6), 0 0 0 1px rgba(255,255,255,0.15);animation:float 5s ease-in-out infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.stat{background:rgba(255,255,255,0.04);border:1px solid rgba(255,255,255,0.06);border-radius:12px;padding:12px;text-align:center}
.stat strong{display:block;font-family:'VT323';font-size:28px;color:#fff;line-height:1}
.stat span{font-size:11px;color:var(--muted);letter-spacing:1px;text-transform:uppercase}
/* SECTIONS */
section{padding:64px 0}
h2{font-size:48px;line-height:0.95;margin-bottom:10px;text-align:center}
h2 .accent{color:var(--cyan)}
.sub{text-align:center;color:var(--muted);font-size:18px;margin-bottom:32px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:620px){.grid{grid-template-columns:1fr}}
.card{
  background:var(--panel);backdrop-filter:blur(12px);
  border:1px solid var(--line);border-radius:16px;padding:22px;
  display:flex;flex-direction:column;gap:10px;
  transition:transform .22s, border-color .22s, box-shadow .22s;
  position:relative;overflow:hidden;
}
.card::after{content:"";position:absolute;top:0;left:0;right:0;height:2px;background:var(--accent, var(--cyan));opacity:.8;box-shadow:0 0 12px var(--accent)}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 12px 40px rgba(0,0,0,0.4), 0 0 20px color-mix(in srgb, var(--accent) 30%, transparent)}
.tag{align-self:flex-start;font-family:'VT323';font-size:16px;padding:3px 10px;border:1px solid currentColor;border-radius:999px;letter-spacing:1px}
.card h3{font-size:28px;color:#fff;line-height:1.05;min-height:2.1em}
.card p{color:var(--muted);font-size:15px;line-height:1.5}
.foot{margin-top:auto;border-top:1px solid var(--line);padding-top:12px;display:flex;justify-content:space-between;align-items:center;font-family:'VT323';font-size:18px;color:var(--muted)}
.foot a{color:var(--accent);text-decoration:none}.foot a:hover{text-decoration:underline}
/* DISCORD BANNER SECTION */
.discord-banner {
  background: linear-gradient(135deg, rgba(88,101,242,0.18), rgba(0,229,255,0.08));
  border: 1px solid rgba(88,101,242,0.3);
  border-radius: 24px;
  padding: 40px;
  text-align: center;
  margin: 40px 0;
  box-shadow: 0 20px 50px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  position: relative;
  overflow: hidden;
}
.discord-banner h3 {
  font-size: 42px;
  color: #fff;
  margin-bottom: 12px;
}
.discord-banner p {
  color: var(--muted);
  font-size: 18px;
  max-width: 600px;
  margin: 0 auto 24px auto;
  line-height: 1.5;
}
/* HOW */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;position:relative}
@media(max-width:900px){.steps{grid-template-columns:repeat(2,1fr)}}
@media(max-width:520px){.steps{grid-template-columns:1fr}}
.step{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;position:relative}
.step-n{font-family:'VT323';font-size:52px;color:var(--cyan);text-shadow:0 0 12px rgba(0,229,255,0.4);line-height:1}
.step h3{font-size:26px;margin:6px 0 6px;color:#fff}
.step p{color:var(--muted);font-size:14px;line-height:1.5}
/* VIDEO GRID */
.vgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;max-width:980px;margin:0 auto}
@media(max-width:640px){.vgrid{grid-template-columns:1fr}}
.vbox{position:relative;border-radius:16px;overflow:hidden;background:#000;border:1px solid var(--accent, var(--cyan));box-shadow:0 0 24px color-mix(in srgb, var(--accent) 25%, transparent);aspect-ratio:16/9}
.vbox video{width:100%;height:100%;object-fit:contain;display:block}
.vbox:hover{transform:translateY(-3px);transition:transform .2s}
.vtag{position:absolute;left:10px;bottom:10px;background:rgba(6,2,15,0.8);border:1px solid var(--accent);color:var(--accent);font-family:'VT323';font-size:14px;padding:3px 10px;border-radius:999px}
/* PRICING */
.plans{display:grid;grid-template-columns:repeat(2,1fr);gap:20px;max-width:900px;margin:0 auto;align-items:stretch}
@media(max-width:720px){.plans{grid-template-columns:1fr}}
.plan{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:28px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.plan.best{border-color:var(--pink);background:linear-gradient(180deg, rgba(255,42,138,0.12), var(--panel));box-shadow:0 0 40px rgba(255,42,138,0.22)}
.plan.best::before{content:"BEST VALUE";position:absolute;top:14px;right:-32px;background:var(--pink);color:#fff;font-family:'VT323';font-size:16px;padding:4px 36px;transform:rotate(18deg)}
.plan h3{font-size:32px;color:#fff}
.price{font-family:'VT323';font-size:56px;color:#fff;line-height:1}
.price small{font-size:20px;color:var(--muted)}
.plan ul{list-style:none;display:flex;flex-direction:column;gap:8px}
.plan li{color:var(--muted);font-size:15px;padding-left:22px;position:relative}
.plan li::before{content:"✓";position:absolute;left:0;color:var(--lime)}
.note{text-align:center;color:var(--muted);font-size:13px;margin-top:18px}
/* FAQ */
.faq{max-width:760px;margin:0 auto}
.faq details{border-bottom:1px solid var(--line);padding:16px 0}
.faq summary{cursor:pointer;font-family:'VT323';font-size:22px;color:#fff;list-style:none;display:flex;justify-content:space-between;align-items:center}
.faq summary::after{content:"+";color:var(--cyan);font-size:28px}
.faq details[open] summary::after{content:"−"}
.faq p{color:var(--muted);font-size:15px;margin-top:8px;line-height:1.6}
/* FOOTER */
footer{border-top:1px solid var(--line);padding:40px 0;text-align:center;color:var(--muted)}
footer .links{display:flex;flex-wrap:wrap;gap:8px 18px;justify-content:center;margin:14px 0}
footer .links a{color:var(--cyan);text-decoration:none;font-family:'VT323';font-size:18px}
footer .links a:hover{text-decoration:underline}
.legal{max-width:720px;margin:12px auto 0;font-size:12px;opacity:.7;line-height:1.5}
/* CONSENT */
.consent{position:fixed;left:16px;right:16px;bottom:16px;z-index:300;max-width:720px;margin:0 auto;background:rgba(14,12,32,0.96);border:1px solid var(--cyan);border-radius:12px;padding:16px 18px;box-shadow:0 0 30px rgba(0,229,255,0.25);display:none;backdrop-filter:blur(12px)}
.consent.show{display:block}
.consent p{font-size:14px;line-height:1.4;margin-bottom:12px;color:var(--muted)}
.consent-btns{display:flex;gap:10px}
.consent button{font-family:'VT323';font-size:18px;padding:7px 18px;border-radius:999px;cursor:pointer;border:1px solid var(--cyan)}
.c-accept{background:var(--pink);border-color:var(--pink)!important;color:#fff}
.c-decline{background:transparent;color:var(--cyan)}
</style>
</head>
